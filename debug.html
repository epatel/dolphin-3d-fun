<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dolphin Debug</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; overflow: hidden; font-family: system-ui, sans-serif; }
        canvas { display: block; }
        #controls {
            position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 20px; align-items: center;
            background: rgba(0,0,0,0.7); padding: 14px 24px; border-radius: 12px;
            color: #ccc; font-size: 13px;
        }
        #controls label { display: flex; flex-direction: column; align-items: center; gap: 4px; }
        #controls input[type="range"] { width: 180px; }
        #controls .value { color: #00d4ff; font-variant-numeric: tabular-nums; min-width: 48px; text-align: center; }
        #view-btns { position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 8px; }
        #view-btns button {
            background: rgba(0,0,0,0.6); color: #ccc; border: 1px solid rgba(255,255,255,0.15);
            padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
        }
        #view-btns button.active { background: rgba(0,212,255,0.2); color: #00d4ff; border-color: #00d4ff; }
    </style>
</head>
<body>
    <div id="view-btns">
        <button data-view="side" class="active">Side</button>
        <button data-view="top">Top</button>
        <button data-view="front">Front</button>
        <button data-view="free">Free (drag)</button>
    </div>
    <div id="controls">
        <label>
            Yaw Error
            <input type="range" id="yaw" min="-1.5" max="1.5" step="0.01" value="0">
            <span class="value" id="yaw-val">0.00</span>
        </label>
        <label>
            Speed
            <input type="range" id="speed" min="0" max="5" step="0.05" value="1.5">
            <span class="value" id="speed-val">1.50</span>
        </label>
        <label>
            Bend Scale
            <input type="range" id="bend" min="0" max="1.0" step="0.01" value="0.5">
            <span class="value" id="bend-val">0.50</span>
        </label>
    </div>

    <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/" } }
    </script>
    <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { createDolphin } from './dolphin.js';

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 50);
    camera.position.set(0, 0.5, 3.5);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0, 0);

    // Lighting
    scene.add(new THREE.AmbientLight(0x8899bb, 0.6));
    const dir = new THREE.DirectionalLight(0xffffff, 1.2);
    dir.position.set(3, 4, 2);
    scene.add(dir);
    scene.add(new THREE.DirectionalLight(0x4488cc, 0.4).position.set(-2, -1, 3));

    // Grid
    const grid = new THREE.GridHelper(4, 20, 0x333355, 0x222244);
    grid.rotation.x = Math.PI / 2;
    scene.add(grid);

    // Axes
    scene.add(new THREE.AxesHelper(1.2));

    // Dolphin
    const { group: dolphin, animate: animateDolphin } = createDolphin();
    dolphin.scale.setScalar(0.5);
    scene.add(dolphin);

    // Sliders
    const yawSlider = document.getElementById('yaw');
    const speedSlider = document.getElementById('speed');
    const bendSlider = document.getElementById('bend');
    const yawVal = document.getElementById('yaw-val');
    const speedVal = document.getElementById('speed-val');
    const bendVal = document.getElementById('bend-val');

    // Camera presets
    const views = {
        side:  { pos: [3.5, 0.3, 0], target: [0, 0, 0] },
        top:   { pos: [0, 3.5, 0], target: [0, 0, 0] },
        front: { pos: [0, 0.3, 3.5], target: [0, 0, 0] },
    };

    document.getElementById('view-btns').addEventListener('click', e => {
        if (e.target.tagName !== 'BUTTON') return;
        document.querySelectorAll('#view-btns button').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        const v = e.target.dataset.view;
        if (views[v]) {
            camera.position.set(...views[v].pos);
            controls.target.set(...views[v].target);
        }
    });

    let bendOverride = 0.5;

    const clock = new THREE.Clock();
    function loop() {
        requestAnimationFrame(loop);
        const dt = Math.min(clock.getDelta(), 0.05);

        const yaw = parseFloat(yawSlider.value);
        const spd = parseFloat(speedSlider.value);
        bendOverride = parseFloat(bendSlider.value);

        yawVal.textContent = yaw.toFixed(2);
        speedVal.textContent = spd.toFixed(2);
        bendVal.textContent = bendOverride.toFixed(3);

        const effectiveYaw = yaw * (bendOverride / 0.5);
        animateDolphin(spd, dt, effectiveYaw);

        controls.update();
        renderer.render(scene, camera);
    }
    loop();

    window.addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
    });
    </script>
</body>
</html>
